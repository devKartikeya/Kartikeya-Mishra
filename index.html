<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Kartikeya Mishra | Full-Stack Developer</title>

    <meta
      name="description"
      content="Kartikeya Mishra is a full-stack developer building modern web applications with JavaScript, React, Node.js, Express, MongoDB, Laravel, Docker, and DevOps technologies."
    />

    <meta
      name="keywords"
      content="Kartikeya Mishra, Full Stack Developer, MERN Developer, React Developer, Node.js Developer, JavaScript Developer, Laravel Developer, DevOps, System Design"
    />

    <meta name="author" content="Kartikeya Mishra" />

    <!-- Search engine behavior -->
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/Profile.jpeg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://my-domain.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kartikeya Mishra | Full-Stack Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Kartikeya Mishra — full-stack developer focused on modern web development, system design, and DevOps."
    />
    <meta
      property="og:image"
      content="https://my-domain.com/Profile.jpeg"
    />
    <meta property="og:url" content="https://my-domain.com/" />
    <meta property="og:site_name" content="Kartikeya Mishra" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Kartikeya Mishra | Full-Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Kartikeya Mishra — full-stack developer focused on modern web development, system design, and DevOps."
    />
    <meta
      name="twitter:image"
      content="https://my-domain.com/Profile.jpeg"
    />

    <!-- Performance: establish connections early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- React/Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <noscript>
      JavaScript is required to view this portfolio.
    </noscript>

    <div id="root"></div>
  </body>
</html>
